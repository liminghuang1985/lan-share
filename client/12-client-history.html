<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Share · 我的记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="11-client-browse.html" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <span class="logo-text">LAN Share</span>
      </a>
      <span class="header-sep">›</span>
      <span class="header-crumb">我的记录</span>
    </div>
    <div class="header-right">
      <!-- 主题切换 -->
      <button class="btn-icon" id="theme-toggle-btn" onclick="toggleTheme()" title="切换主题">
        <svg class="theme-icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <!-- 用户菜单 -->
      <div class="user-menu" id="userMenu">
        <div class="user-avatar" id="userAvatar">?</div>
        <span class="user-name" id="userName">加载中...</span>
        <svg class="dropdown-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
        <div class="user-dropdown" id="userDropdown">
          <div class="dropdown-item" id="userRole" style="color: var(--text-tertiary); font-size: 12px;"></div>
          <div class="dropdown-divider"></div>
          <a href="11-client-browse.html" class="dropdown-item">
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            文件浏览
          </a>
          <button class="dropdown-item danger" onclick="doLogout()">
            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            退出登录
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <!-- 页面头部 -->
    <div class="page-header">
      <h1>我的记录</h1>
      <p>查看您的上传和下载历史</p>
    </div>

    <!-- 标签切换 -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="tab" data-filter="download" onclick="setFilter('download')">下载</button>
      <button class="tab" data-filter="upload" onclick="setFilter('upload')">上传</button>
    </div>

    <!-- 记录列表 -->
    <div class="record-list" id="recordList">
      <div class="loading-state">
        <span class="spinner"></span>
        <span>加载中...</span>
      </div>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination" style="display:none">
      <span class="pagination-info" id="paginationInfo"></span>
      <div class="pagination-controls" id="paginationControls"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // ============ 状态 ============
    let records = [];
    let total = 0;
    let page = 1;
    const limit = 20;
    let filter = 'all';
    let user = null;

    // ============ 主题切换 ============
    function toggleTheme() { Theme.toggle(); }

    // ============ 初始化 ============
    document.addEventListener('DOMContentLoaded', async () => {
      Theme.init();

      const auth = await requireAuth();
      if (!auth) return;

      user = getCurrentUser();
      if (!user) {
        try {
          const data = await Api.me();
          user = data.user;
          setCurrentUser(user);
        } catch {}
      }

      if (user) {
        document.getElementById('userName').textContent = user.display_name || user.username;
        document.getElementById('userAvatar').textContent = (user.display_name || user.username)[0].toUpperCase();
        document.getElementById('userRole').textContent = user.role === 'admin' ? '管理员' : user.role === 'readonly' ? '只读用户' : '普通用户';
      }

      // 用户下拉
      document.getElementById('userMenu').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('userDropdown').classList.toggle('show');
      });
      document.addEventListener('click', () => {
        document.getElementById('userDropdown').classList.remove('show');
      });

      await loadHistory();
    });

    // ============ 加载历史 ============
    async function loadHistory() {
      const container = document.getElementById('recordList');
      container.innerHTML = `<div class="loading-state"><span class="spinner"></span><span>加载中...</span></div>`;

      try {
        const data = await Api.getHistory(page, limit);
        records = data.logs || [];
        total = data.total || 0;

        // 按 filter 过滤
        applyFilter();

      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>加载失败：${err.message}</p></div>`;
        showToast('加载历史记录失败', 'error');
      }
    }

    // ============ 过滤 ============
    function setFilter(f) {
      filter = f;
      // 更新 tab 样式
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.filter === f);
      });
      applyFilter();
    }

    function applyFilter() {
      const filtered = filter === 'all' ? records : records.filter(r => r.action === filter);
      renderRecords(filtered);
      renderPagination();
    }

    // ============ 渲染记录 ============
    function renderRecords(items) {
      const container = document.getElementById('recordList');

      if (!items.length) {
        const emptyText = filter === 'all' ? '暂无操作记录' :
                          filter === 'download' ? '暂无下载记录' : '暂无上传记录';
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            <p>${emptyText}</p>
          </div>`;
        return;
      }

      container.innerHTML = items.map(r => {
        const isDownload = r.action === 'download';
        const actionText = isDownload ? '下载' : '上传';
        const iconClass = isDownload ? 'download' : 'upload';
        const iconSvg = isDownload
          ? `<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>`
          : `<svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>`;
        const details = r.details ? JSON.parse(r.details) : {};
        const fileName = details.originalName || r.file_path || '-';
        const folderName = details.folderName || '';

        return `
          <div class="record-item">
            <div class="record-icon ${iconClass}">${iconSvg}</div>
            <div class="record-content">
              <div class="record-title">${escapeHtml(fileName)}</div>
              <div class="record-meta">
                ${folderName ? `<span>${escapeHtml(folderName)} · </span>` : ''}
                <span>${formatDate(r.created_at)}</span>
                ${r.ip_address ? `<span> · ${r.ip_address}</span>` : ''}
              </div>
            </div>
            <div class="record-size">${r.file_size ? formatFileSize(r.file_size) : ''}</div>
            <div class="record-badge ${r.status === 'success' ? 'success' : 'warning'}">${r.status === 'success' ? '成功' : '失败'}</div>
          </div>`;
      }).join('');
    }

    // ============ 分页 ============
    function renderPagination() {
      const container = document.getElementById('pagination');
      const info = document.getElementById('paginationInfo');
      const controls = document.getElementById('paginationControls');

      if (total === 0) {
        container.style.display = 'none';
        return;
      }

      const totalPages = Math.ceil(total / limit);
      container.style.display = 'flex';

      const from = (page - 1) * limit + 1;
      const to = Math.min(page * limit, total);
      info.textContent = `显示 ${from}-${to} 条，共 ${total} 条`;

      // 页码按钮
      const pages = getPageNumbers(page, totalPages);
      controls.innerHTML = pages.map(p => {
        if (p === '...') return `<span class="page-ellipsis">...</span>`;
        return `<button class="page-btn ${p === page ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
      }).join('');
    }

    function getPageNumbers(current, total) {
      if (total <= 7) return range(1, total);
      const pages = [1];
      if (current > 3) pages.push('...');
      for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) pages.push(i);
      if (current < total - 2) pages.push('...');
      pages.push(total);
      return pages;
    }

    function range(start, end) {
      return Array.from({ length: end - start + 1 }, (_, i) => start + i);
    }

    function goToPage(p) {
      page = p;
      loadHistory();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============ 登出 ============
    async function doLogout() {
      await Api.logout();
      showToast('已退出登录', 'success');
      setTimeout(() => redirectToLogin(), 300);
    }

    // ============ 工具 ============
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
