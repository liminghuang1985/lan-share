<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Share · 客户端登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <!-- 主题切换 -->
    <button class="theme-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="切换主题">
      <svg class="theme-icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <div class="login-container">
      <div class="logo-section">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </div>
        <h1>LAN Share</h1>
        <p>请登录以访问共享文件</p>
      </div>

      <div class="login-card">
        <!-- 服务器状态 -->
        <div class="server-status" id="server-status">
          <span class="server-dot offline"></span>
          <span class="server-text">正在连接服务器...</span>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">用户名</label>
            <div class="input-wrapper">
              <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
            </div>
          </div>

          <div class="form-group">
            <label for="password">密码</label>
            <div class="input-wrapper">
              <svg viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
              <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
          </div>

          <div class="error-msg" id="errorMsg" style="display:none"></div>

          <button type="submit" class="btn-primary" id="loginBtn">
            <span class="btn-text">登录</span>
            <span class="spinner" style="display:none"></span>
          </button>
        </form>
      </div>

      <p class="footer-note">
        如有问题请联系管理员
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // ============ 主题切换 ============
    function toggleTheme() {
      Theme.toggle();
    }

    // ============ 检查服务器连通性 ============
    async function checkServer() {
      const el = document.getElementById('server-status');
      try {
        const res = await fetch('/api/health', { cache: 'no-cache' });
        if (res.ok) {
          el.innerHTML = `
            <span class="server-dot online"></span>
            <span class="server-text">服务器已连接</span>
          `;
        } else {
          throw new Error('unhealthy');
        }
      } catch {
        el.innerHTML = `
          <span class="server-dot offline"></span>
          <span class="server-text">服务器连接失败</span>
        `;
      }
    }

    // ============ 登录表单 ============
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = loginBtn.querySelector('.btn-text');
    const btnSpinner = loginBtn.querySelector('.spinner');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // 简单验证
      if (!username) {
        showError('请输入用户名');
        return;
      }
      if (!password) {
        showError('请输入密码');
        return;
      }

      // 禁用按钮，显示加载态
      setLoading(true);
      errorMsg.style.display = 'none';

      try {
        const data = await Api.login(username, password);

        // 保存用户信息
        setCurrentUser({
          id: data.user?.id,
          username: data.user?.username || username,
          display_name: data.user?.display_name || username,
          role: data.user?.role || 'user'
        });

        showToast('登录成功', 'success');
        setTimeout(() => redirectToBrowse(), 300);

      } catch (err) {
        if (err.status === 401) {
          showError('用户名或密码错误');
        } else if (err.status === 403) {
          showError('账号已被禁用，请联系管理员');
        } else if (err.message.includes('网络错误') || err.message.includes('Failed to fetch')) {
          showError('无法连接服务器，请检查网络');
        } else {
          showError(err.message || '登录失败，请重试');
        }
      } finally {
        setLoading(false);
      }
    });

    function setLoading(loading) {
      loginBtn.disabled = loading;
      btnText.style.display = loading ? 'none' : 'inline';
      btnSpinner.style.display = loading ? 'inline-block' : 'none';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'flex';
    }

    // ============ 初始化 ============
    document.addEventListener('DOMContentLoaded', () => {
      Theme.init();
      checkServer();

      // 如果已有 token，直接跳转
      if (localStorage.getItem('ls_token')) {
        Api.verify().then(data => {
          if (data.valid) redirectToBrowse();
        }).catch(() => {});
      }
    });
  </script>
</body>
</html>
