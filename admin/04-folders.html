<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Share · 文件夹管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .path-col { font-size: 12px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .desc-col { font-size: 13px; color: var(--text-secondary); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder-icon { width: 38px; height: 38px; background: var(--accent-subtle); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .folder-icon svg { width: 20px; height: 20px; fill: var(--accent); }
  </style>
</head>
<body>
<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <span class="sidebar-logo-text">LAN Share</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section"><div class="nav-section-title">概览</div>
        <a href="02-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>仪表盘</a>
      </div>
      <div class="nav-section"><div class="nav-section-title">管理</div>
        <a href="03-users.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>用户管理</a>
        <a href="04-folders.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>文件夹管理</a>
        <a href="05-permissions.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>权限配置</a>
      </div>
      <div class="nav-section"><div class="nav-section-title">日志</div>
        <a href="06-logs.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>审计日志</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="admin-info">
        <div class="admin-avatar" id="adminAvatar">管</div>
        <div><div class="admin-name" id="adminName">管理员</div><div class="admin-role">系统管理员</div></div>
      </div>
      <button class="btn btn-ghost" onclick="doLogout()" style="font-size:12px;">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        退出登录
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <div class="page-header">
      <h1>文件夹管理</h1>
      <p>管理系统共享文件夹</p>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" class="input" id="searchInput" placeholder="搜索文件夹名称或描述..." style="width:260px;">
        </div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          新建文件夹
        </button>
      </div>
    </div>

    <div class="card" style="overflow:hidden;">
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>文件夹</th>
              <th>描述</th>
              <th>物理路径</th>
              <th>创建者</th>
              <th>授权用户</th>
              <th>创建时间</th>
              <th style="text-align:right">操作</th>
            </tr>
          </thead>
          <tbody id="foldersTable">
            <tr><td colspan="7" class="loading-state"><span class="spinner"></span><span>加载中...</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="pagination" id="pagination" style="display:none;">
      <span class="pagination-info" id="paginationInfo"></span>
      <div class="pagination-controls" id="paginationControls"></div>
    </div>
  </main>
</div>

<div id="folderModal"></div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script>
let folders = [];
let total = 0;
let page = 1;
const limit = 20;

document.addEventListener('DOMContentLoaded', async () => {
  Theme.init();
  const ok = await requireAdmin();
  if (!ok) return;
  highlightNav('04-folders.html');
  const user = getCurrentUser() || {};
  document.getElementById('adminName').textContent = user.display_name || user.username || '管理员';
  document.getElementById('adminAvatar').textContent = (user.display_name || user.username || '管')[0].toUpperCase();

  document.getElementById('searchInput').addEventListener('input', debounce(() => { page = 1; loadFolders(); }, 350));
  await loadFolders();
});

async function loadFolders() {
  const tbody = document.getElementById('foldersTable');
  tbody.innerHTML = '<tr><td colspan="7" class="loading-state"><span class="spinner"></span><span>加载中...</span></td></tr>';

  const params = {
    page, limit,
    search: document.getElementById('searchInput').value.trim()
  };

  try {
    const data = await Api.getFolders(params);
    folders = data.folders || [];
    total = data.total || 0;
    renderFolders();
    renderPagination();
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">加载失败：${err.message}</td></tr>`;
    showToast('加载文件夹列表失败', 'error');
  }
}

function renderFolders() {
  const tbody = document.getElementById('foldersTable');
  if (!folders.length) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><p>暂无文件夹</p></div></td></tr>';
    return;
  }

  tbody.innerHTML = folders.map(f => `
    <tr>
      <td>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="folder-icon">
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          </div>
          <div>
            <div style="font-weight:500;font-size:13px;">${escapeHtml(f.name)}</div>
          </div>
        </div>
      </td>
      <td><div class="desc-col">${escapeHtml(f.description || '-')}</div></td>
      <td><div class="path-col" title="${escapeHtml(f.path)}">${escapeHtml(f.path)}</div></td>
      <td style="font-size:12px;color:var(--text-secondary);">${escapeHtml(f.creator_name || '-')}</td>
      <td><span class="badge badge-gray">${f.user_count || 0} 人</span></td>
      <td style="font-size:12px;color:var(--text-tertiary);">${formatDateShort(f.created_at)}</td>
      <td class="col-actions">
        <div class="btn-group">
          <button class="btn btn-ghost btn-sm" onclick="openEditModal(${f.id})">编辑</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" onclick="confirmDelete(${f.id}, '${escapeHtml(f.name)}')">删除</button>
        </div>
      </td>
    </tr>`).join('');
}

function renderPagination() {
  const container = document.getElementById('pagination');
  const info = document.getElementById('paginationInfo');
  const controls = document.getElementById('paginationControls');
  if (total === 0) { container.style.display = 'none'; return; }
  const totalPages = Math.ceil(total / limit);
  container.style.display = 'flex';
  const from = (page - 1) * limit + 1;
  const to = Math.min(page * limit, total);
  info.textContent = `显示 ${from}-${to} 条，共 ${total} 条`;
  const pages = getPageNumbers(page, totalPages);
  controls.innerHTML = pages.map(p => p === '...' ? `<span class="page-ellipsis">...</span>` : `<button class="page-btn ${p === page ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`).join('');
}

function getPageNumbers(c, t) {
  if (t <= 7) return range(1, t);
  const p = [1];
  if (c > 3) p.push('...');
  for (let i = Math.max(2, c - 1); i <= Math.min(t - 1, c + 1); i++) p.push(i);
  if (c < t - 2) p.push('...');
  p.push(t);
  return p;
}

function range(s, e) { return Array.from({ length: e - s + 1 }, (_, i) => s + i); }
function goPage(p) { page = p; loadFolders(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

// Detect base storage path from DB seed
const DEFAULT_BASE_PATH = 'D:/共享文件';

function openCreateModal() { openFolderModal(); }

function openEditModal(id) {
  const f = folders.find(x => x.id === id);
  if (!f) return;
  openFolderModal(f);
}

function openFolderModal(folder = null) {
  const isEdit = !!folder;
  document.getElementById('folderModal').innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <span class="modal-title">${isEdit ? '编辑文件夹' : '新建文件夹'}</span>
          <button class="btn-icon" onclick="closeModal()">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>文件夹名称 *</label>
            <input type="text" class="input" id="m-name" value="${isEdit ? escapeHtml(folder.name) : ''}" placeholder="例如：技术部资料">
          </div>
          <div class="form-group">
            <label>物理路径 *</label>
            <input type="text" class="input" id="m-path" value="${isEdit ? escapeHtml(folder.path) : ''}" placeholder="例如：${DEFAULT_BASE_PATH}/技术部" style="font-size:12px;">
            <div style="font-size:11px;color:var(--text-tertiary);margin-top:4px;">服务器上存储文件的绝对路径，建议使用英文路径</div>
          </div>
          <div class="form-group">
            <label>描述</label>
            <textarea class="input" id="m-desc" placeholder="文件夹用途说明（可选）" style="min-height:64px;">${isEdit ? escapeHtml(folder.description || '') : ''}</textarea>
          </div>
          <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="modalSaveBtn" onclick="saveFolder(${isEdit ? folder.id : 'null'})">${isEdit ? '保存修改' : '创建文件夹'}</button>
          </div>
        </div>
      </div>
    </div>`;
}

async function saveFolder(id) {
  const name = document.getElementById('m-name').value.trim();
  const path = document.getElementById('m-path').value.trim();
  const description = document.getElementById('m-desc').value.trim();

  if (!name) { showToast('请输入文件夹名称', 'error'); return; }
  if (!path) { showToast('请输入物理路径', 'error'); return; }

  const btn = document.getElementById('modalSaveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  try {
    if (id) {
      await Api.updateFolder(id, { name, path, description });
      showToast('文件夹已更新', 'success');
    } else {
      await Api.createFolder({ name, path, description });
      showToast('文件夹已创建', 'success');
    }
    closeModal();
    loadFolders();
  } catch (err) {
    showToast(err.message || '保存失败', 'error');
    btn.disabled = false;
    btn.textContent = id ? '保存修改' : '创建文件夹';
  }
}

function confirmDelete(id, name) {
  showModal({
    title: '确认删除',
    body: `<p style="font-size:14px;color:var(--text-secondary);">确定要删除文件夹 <strong>${escapeHtml(name)}</strong> 吗？所有相关权限也会被清除。</p>`,
    confirmText: '删除', danger: true,
    onConfirm: async () => {
      try {
        await Api.deleteFolder(id);
        showToast('文件夹已删除', 'success');
        loadFolders();
      } catch (err) {
        showToast(err.message || '删除失败', 'error');
      }
    }
  });
}
</script>
</body>
</html>
