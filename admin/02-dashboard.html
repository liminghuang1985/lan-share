<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Share · 仪表盘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
</head>
<body>
<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <span class="sidebar-logo-text">LAN Share</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">概览</div>
        <a href="02-dashboard.html" class="nav-item active" id="nav-dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          仪表盘
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">管理</div>
        <a href="03-users.html" class="nav-item" id="nav-users">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          用户管理
        </a>
        <a href="04-folders.html" class="nav-item" id="nav-folders">
          <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          文件夹管理
        </a>
        <a href="05-permissions.html" class="nav-item" id="nav-permissions">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
          权限配置
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">日志</div>
        <a href="06-logs.html" class="nav-item" id="nav-logs">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
          审计日志
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-info">
        <div class="admin-avatar" id="adminAvatar">管</div>
        <div class="admin-details">
          <div class="admin-name" id="adminName">管理员</div>
          <div class="admin-role">系统管理员</div>
        </div>
      </div>
      <button class="btn btn-ghost" onclick="doLogout()" style="font-size:12px;">
        <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        退出登录
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main" id="main">
    <div class="page-header">
      <h1>仪表盘</h1>
      <p>实时监控局域网共享文件状态</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card" id="stat-users">
        <div class="stat-header">
          <div class="stat-icon blue">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          </div>
        </div>
        <div class="stat-value" id="stat-users-val">-</div>
        <div class="stat-label">注册用户</div>
      </div>

      <div class="stat-card" id="stat-folders">
        <div class="stat-header">
          <div class="stat-icon purple">
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          </div>
        </div>
        <div class="stat-value" id="stat-folders-val">-</div>
        <div class="stat-label">共享文件夹</div>
      </div>

      <div class="stat-card" id="stat-today">
        <div class="stat-header">
          <div class="stat-icon green">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          </div>
        </div>
        <div class="stat-value" id="stat-today-val">-</div>
        <div class="stat-label">今日操作</div>
      </div>

      <div class="stat-card" id="stat-total">
        <div class="stat-header">
          <div class="stat-icon orange">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
          </div>
        </div>
        <div class="stat-value" id="stat-total-val">-</div>
        <div class="stat-label">总记录数</div>
      </div>
    </div>

    <!-- Content Grid -->
    <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
      <!-- Recent Activity -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">最近活动</span>
          <a href="06-logs.html" class="card-action">查看全部 →</a>
        </div>
        <div id="activity-container">
          <div class="loading-state">
            <span class="spinner"></span>
            <span>加载中...</span>
          </div>
        </div>
      </div>

      <!-- Right Column -->
      <div>
        <!-- Quick Actions -->
        <div class="card" style="margin-bottom:20px;">
          <div class="card-header">
            <span class="card-title">快捷操作</span>
          </div>
          <div class="card-body">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
              <a href="03-users.html" class="quick-action-link">
                <div class="quick-action-icon purple">
                  <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <span>添加用户</span>
              </a>
              <a href="04-folders.html" class="quick-action-link">
                <div class="quick-action-icon blue">
                  <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
                </div>
                <span>新建文件夹</span>
              </a>
              <a href="05-permissions.html" class="quick-action-link">
                <div class="quick-action-icon green">
                  <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
                </div>
                <span>配置权限</span>
              </a>
              <a href="06-logs.html" class="quick-action-link">
                <div class="quick-action-icon orange">
                  <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
                </div>
                <span>查看日志</span>
              </a>
            </div>
          </div>
        </div>

        <!-- System Info -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">系统信息</span>
            <button class="btn-icon" id="theme-toggle-btn" onclick="toggleTheme()" title="切换主题">
              <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
          </div>
          <div class="card-body" style="font-size:13px; color:var(--text-secondary);">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <span>版本</span><span style="color:var(--text-primary);">v1.0.0</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <span>数据库</span><span style="color:var(--success);">已连接</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
              <span>客户端</span>
              <a href="../client/10-client-login.html" style="color:var(--accent); text-decoration:none;">打开客户端 →</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<style>
.quick-action-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  text-decoration: none;
  color: inherit;
}
.quick-action-link:hover { border-color: var(--accent); background: var(--bg-secondary); }
.quick-action-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.quick-action-icon svg { width: 20px; height: 20px; fill: white; }
.quick-action-icon.purple { background: var(--accent); }
.quick-action-icon.blue { background: #3B82F6; }
.quick-action-icon.green { background: var(--success); }
.quick-action-icon.orange { background: var(--warning); }
.quick-action-link span { font-size: 12px; color: var(--text-secondary); }

.activity-list { list-style: none; }
.activity-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 20px; border-bottom: 1px solid var(--border-subtle);
}
.activity-item:last-child { border-bottom: none; }
.activity-icon {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.activity-icon svg { width: 15px; height: 15px; fill: white; }
.activity-icon.download { background: var(--success); }
.activity-icon.upload { background: #3B82F6; }
.activity-icon.login { background: var(--accent); }
.activity-icon.create_user { background: #3B82F6; }
.activity-icon.delete_user { background: var(--error); }
.activity-icon.update_user { background: var(--warning); }
.activity-icon.set_permission { background: #8B5CF6; }
.activity-icon.other { background: var(--text-tertiary); }

.activity-content { flex: 1; min-width: 0; }
.activity-text { font-size: 13px; margin-bottom: 2px; }
.activity-time { font-size: 11px; color: var(--text-tertiary); }

.empty-activity {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-tertiary);
  font-size: 13px;
}
</style>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script>
function toggleTheme() { Theme.toggle(); }

document.addEventListener('DOMContentLoaded', async () => {
  Theme.init();

  const ok = await requireAdmin();
  if (!ok) return;

  highlightNav('02-dashboard.html');

  const user = getCurrentUser() || {};
  document.getElementById('adminName').textContent = user.display_name || user.username || '管理员';
  document.getElementById('adminAvatar').textContent = (user.display_name || user.username || '管')[0].toUpperCase();

  loadStats();
  loadRecentActivity();
});

async function loadStats() {
  try {
    const data = await Api.getDashboardStats();
    document.getElementById('stat-users-val').textContent = data.totalUsers ?? '-';
    document.getElementById('stat-folders-val').textContent = data.totalFolders ?? '-';
    document.getElementById('stat-today-val').textContent = (data.todayLogs || []).reduce ? data.todayLogs.reduce((s, l) => s + l.count, 0) : (data.todayLogs?.length ?? 0);
    document.getElementById('stat-total-val').textContent = data.totalLogs ?? '-';
  } catch (err) {
    document.querySelectorAll('.stat-value').forEach(el => { el.textContent = '-'; });
  }
}

async function loadRecentActivity() {
  const container = document.getElementById('activity-container');
  try {
    const data = await Api.getAuditLogs({ limit: 8 });
    const logs = data.logs || [];

    if (!logs.length) {
      container.innerHTML = '<div class="empty-activity">暂无活动记录</div>';
      return;
    }

    container.innerHTML = '<ul class="activity-list">' + logs.map(log => {
      const iconClass = getActivityIcon(log.action);
      const iconSvg = getActivitySvg(log.action);
      const text = getActivityText(log);
      return `<li class="activity-item">
        <div class="activity-icon ${iconClass}">${iconSvg}</div>
        <div class="activity-content">
          <div class="activity-text">${text}</div>
          <div class="activity-time">${formatRelativeTime(log.created_at)} · ${log.ip_address || '-'}</div>
        </div>
      </li>`;
    }).join('') + '</ul>';

  } catch {
    container.innerHTML = '<div class="empty-activity">加载失败</div>';
  }
}

function getActivityIcon(action) {
  const map = {
    download: 'download', upload: 'upload', login: 'login',
    logout: 'login', create_user: 'create_user', delete_user: 'delete_user',
    update_user: 'update_user', set_permission: 'set_permission'
  };
  return map[action] || 'other';
}

function getActivitySvg(action) {
  const svgs = {
    download: '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>',
    upload: '<svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>',
    login: '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
    create_user: '<svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
    delete_user: '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
    update_user: '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
    set_permission: '<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>',
    other: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>'
  };
  return svgs[action] || svgs.other;
}

function getActivityText(log) {
  let name = log.username || '某用户';
  let details = {};
  try { details = log.details ? JSON.parse(log.details) : {}; } catch {}

  const actionMap = {
    login: `${name} 登录了系统`,
    logout: `${name} 退出了系统`,
    download: `${name} 下载了 ${details.fileName || details.originalName || '文件'}`,
    upload: `${name} 上传了 ${details.originalName || '文件'}`,
    create_user: `${name} 创建了新用户 ${details.username || ''}`,
    update_user: `${name} 更新了用户信息`,
    delete_user: `${name} 删除了用户 ${details.username || ''}`,
    set_permission: `${name} 修改了权限配置`,
    batch_user: `${name} 批量更新了用户`,
    batch_permission: `${name} 批量配置了权限`,
    create_folder: `${name} 创建了文件夹 ${details.folderName || ''}`,
    delete_folder: `${name} 删除了文件夹 ${details.folderName || ''}`
  };

  return actionMap[log.action] || `${name} 执行了 ${log.action}`;
}
</script>
</body>
</html>
