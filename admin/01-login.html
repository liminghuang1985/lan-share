<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Share · 管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../admin/css/shared.css">
  <style>
    body { padding: 20px; }
    .login-wrap {
      max-width: 400px;
      margin: 60px auto 0;
    }
    .logo-section { text-align: center; margin-bottom: 36px; }
    .logo-section .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), #8B5CF6);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 32px rgba(97,66,217,0.3);
    }
    .logo-section .logo-icon svg { width: 32px; height: 32px; fill: white; }
    .logo-section h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .logo-section p { font-size: 14px; color: var(--text-secondary); }
    .admin-badge {
      display: inline-block;
      padding: 3px 10px;
      background: var(--accent-subtle);
      color: var(--accent);
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: var(--shadow-card);
    }
    .server-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 7px;
      margin-bottom: 24px;
      font-size: 12px;
      background: var(--bg-tertiary);
    }
    .server-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .server-dot.online { background: var(--success); box-shadow: 0 0 0 3px var(--success-subtle); }
    .server-dot.offline { background: var(--text-tertiary); }
    .server-dot.loading { background: var(--warning); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 7px; }
    .input-icon { position: relative; }
    .input-icon svg {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; fill: var(--text-tertiary); pointer-events: none;
    }
    .input-icon input { padding-left: 36px; }
    .error-msg {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 12px;
      background: var(--error-subtle);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 6px;
      color: var(--error);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .btn-login {
      width: 100%; padding: 11px 16px;
      background: var(--accent); border: none; border-radius: 7px;
      color: white; font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(97,66,217,0.35);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { background: var(--accent-hover); }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .theme-toggle {
      position: absolute; top: 20px; right: 20px;
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .theme-toggle:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .theme-toggle svg { width: 18px; height: 18px; fill: currentColor; }
    .footer-note { text-align: center; margin-top: 20px; font-size: 11px; color: var(--text-tertiary); }
    .footer-note a { color: var(--accent); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- 主题切换 -->
  <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>

  <div class="login-wrap">
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      </div>
      <div class="admin-badge">管理后台</div>
      <h1>LAN Share</h1>
      <p>请使用管理员账号登录</p>
    </div>

    <div class="login-card">
      <div class="server-status" id="server-status">
        <span class="server-dot loading"></span>
        <span class="server-text">正在连接服务器...</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">用户名</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <input type="text" id="username" class="input" placeholder="请输入管理员用户名" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">密码</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <input type="password" id="password" class="input" placeholder="请输入密码" autocomplete="current-password" required>
          </div>
        </div>

        <div class="error-msg" id="errorMsg" style="display:none"></div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">登录管理后台</span>
          <span class="spinner" style="display:none"></span>
        </button>
      </form>
    </div>

    <p class="footer-note">
      <a href="../client/10-client-login.html">切换到客户端</a>
    </p>
  </div>

  <script src="../admin/js/api.js"></script>
  <script src="../admin/js/admin.js"></script>
  <script>
    function toggleTheme() { Theme.toggle(); }

    async function checkServer() {
      const el = document.getElementById('server-status');
      try {
        const res = await fetch('/api/health', { cache: 'no-cache' });
        if (res.ok) {
          el.innerHTML = '<span class="server-dot online"></span><span class="server-text">服务器已连接</span>';
          return;
        }
      } catch {}
      el.innerHTML = '<span class="server-dot offline"></span><span class="server-text">服务器连接失败</span>';
    }

    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = loginBtn.querySelector('.btn-text');
    const btnSpinner = loginBtn.querySelector('.spinner');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username) { showError('请输入用户名'); return; }
      if (!password) { showError('请输入密码'); return; }

      setLoading(true);
      errorMsg.style.display = 'none';

      try {
        const data = await Api.login(username, password);

        if (data.user?.role !== 'admin') {
          await Api.logout();
          showError('该账号不是管理员，无权访问后台');
          return;
        }

        showToast('登录成功', 'success');
        setTimeout(() => redirectToDashboard(), 300);

      } catch (err) {
        if (err.status === 401) showError('用户名或密码错误');
        else if (err.status === 403) showError('账号已被禁用');
        else if (err.message.includes('网络') || err.message.includes('fetch')) showError('无法连接服务器');
        else showError(err.message || '登录失败');
      } finally {
        setLoading(false);
      }
    });

    function setLoading(loading) {
      loginBtn.disabled = loading;
      btnText.style.display = loading ? 'none' : 'inline';
      btnSpinner.style.display = loading ? 'inline-block' : 'none';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'flex';
    }

    document.addEventListener('DOMContentLoaded', () => {
      Theme.init();
      checkServer();
      // 已有有效 token 则跳转
      const token = localStorage.getItem('ls_admin_token');
      if (token) {
        Api.verify().then(d => {
          if (d.valid && d.user?.role === 'admin') redirectToDashboard();
        }).catch(() => {});
      }
    });
  </script>
</body>
</html>
