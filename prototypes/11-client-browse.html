<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Share · 文件浏览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0F1011;
      --bg-secondary: #16181D;
      --bg-tertiary: #1E2027;
      --border: #2A2D37;
      --border-subtle: #22262F;
      --text-primary: #EDEDEF;
      --text-secondary: #8A8D93;
      --text-tertiary: #5C5F66;
      --accent: #6142D9;
      --accent-hover: #7151E5;
      --accent-subtle: rgba(97,66,217,0.12);
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #8B5CF6);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg { width: 16px; height: 16px; fill: white; }
    .logo-text { font-size: 15px; font-weight: 600; }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .breadcrumb-item { color: var(--text-secondary); }
    .breadcrumb-item.active { color: var(--text-primary); font-weight: 500; }
    .breadcrumb-sep { color: var(--text-tertiary); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
      width: 220px;
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      fill: var(--text-tertiary);
    }

    .search-box input {
      width: 100%;
      padding: 7px 10px 7px 32px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
    }

    .search-box input::placeholder { color: var(--text-tertiary); }
    .search-box input:focus { outline: none; border-color: var(--accent); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }

    .btn svg { width: 15px; height: 15px; fill: currentColor; }

    .btn-primary { background: var(--accent); border: none; color: white; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .btn-secondary:hover { background: var(--bg-secondary); }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .user-avatar {
      width: 24px;
      height: 24px;
      background: #3B82F6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: white;
    }

    .user-name { font-size: 13px; color: var(--text-secondary); }

    /* Main */
    .main {
      padding: 20px 24px;
    }

    /* Folder Grid */
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .folder-item,
    .file-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .folder-item:hover,
    .file-item:hover {
      border-color: var(--accent);
      background: var(--bg-tertiary);
    }

    .file-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .file-icon svg { width: 22px; height: 22px; fill: white; }

    .file-icon.folder { background: var(--accent-subtle); }
    .file-icon.folder svg { fill: var(--accent); }

    .file-icon.image { background: linear-gradient(135deg, #10B981, #059669); }
    .file-icon.video { background: linear-gradient(135deg, #EF4444, #DC2626); }
    .file-icon.doc { background: linear-gradient(135deg, #3B82F6, #2563EB); }
    .file-icon.pdf { background: linear-gradient(135deg, #EF4444, #DC2626); }
    .file-icon.zip { background: linear-gradient(135deg, #F59E0B, #D97706); }
    .file-icon.default { background: linear-gradient(135deg, var(--text-tertiary), #4B5563); }

    .file-info { flex: 1; min-width: 0; }

    .file-name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .file-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .folder-item:hover .file-actions,
    .file-item:hover .file-actions { opacity: 1; }

    .action-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .action-btn svg { width: 14px; height: 14px; fill: var(--text-secondary); }
    .action-btn:hover { background: var(--bg-secondary); }
    .action-btn:hover svg { fill: var(--text-primary); }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      background: var(--bg-tertiary);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .empty-icon svg { width: 32px; height: 32px; fill: var(--text-tertiary); }

    .empty-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
    .empty-desc { font-size: 13px; color: var(--text-secondary); }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 61px;
      left: 0;
      bottom: 0;
      width: 220px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      overflow-y: auto;
    }

    .sidebar-section { margin-bottom: 20px; }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 16px;
      margin-bottom: 8px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }

    .sidebar-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }

    .sidebar-item.active {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .sidebar-item svg { width: 16px; height: 16px; fill: currentColor; }

    .sidebar-item .badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 6px;
      background: var(--bg-tertiary);
      border-radius: 10px;
    }

    .sidebar-item.active .badge {
      background: var(--accent);
      color: white;
    }

    .content { margin-left: 220px; }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      gap: 24px;
      padding: 12px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stat-item { display: flex; align-items: center; gap: 6px; }
    .stat-item svg { width: 14px; height: 14px; fill: currentColor; }
  </style>
</head>
<body>
